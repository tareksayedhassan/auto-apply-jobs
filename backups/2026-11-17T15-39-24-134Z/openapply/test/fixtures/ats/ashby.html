<script>
const CITIES = ["Brooklyn, New York, United States", "New York City, New York, United States", "Brookline, Massachusetts, United States"];
// Ashby saves each answer to its server and checks the submit there (see src/apply/adapters/ashby.ts). Text saves on
// blur; a yes/no click saves at once, and clicking the pressed option clears the answer.
const RENDER = Math.random().toString(36).slice(2);
const api = (op, variables) => fetch("/api/non-user-graphql?op=" + op, {
  method: "POST", headers: { "content-type": "application/json" },
  body: JSON.stringify({ operationName: op, variables: { formRenderIdentifier: RENDER, ...variables } }),
}).then(r => r.json());
const save = (path, value) => api("ApiSetFormValue", { path, value });
document.querySelectorAll(".ashby-application-form-input-yesno").forEach(g => g.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
  const on = b.getAttribute("aria-pressed") !== "true", yes = on && b.dataset.option === "yes";
  g.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(on && x === b)));
  const box = g.querySelector("input");
  box.checked = yes;
  save(box.name, on ? yes : null);
})));
document.querySelectorAll("#form input[name][type=text], #form input[type=email], #form input[type=tel], #form textarea").forEach(el =>
  el.addEventListener("blur", () => save(el.name, el.value)));
// A single-select radio question (ValueSelect) names its inputs <form render id>_<path>.
document.querySelectorAll("#form input[type=radio]").forEach(i => /^[\da-f-]{36}_/.test(i.name) && i.addEventListener("change", () =>
  save(i.name.replace(/^[\da-f-]{36}_/, ""), document.querySelector(`label[for="${i.id}"]`).textContent)));
const loc = document.querySelector("[role=combobox]");
let pop = null, t;
const closePop = () => { pop?.remove(); pop = null; loc.setAttribute("aria-expanded", "false"); };
loc.addEventListener("input", () => {
  clearTimeout(t);
  delete loc.dataset.picked;
  const q = loc.value.split(",")[0].trim().toLowerCase();
  if (q.length < 2) return closePop();
  t = setTimeout(() => {
    closePop();
    const r = loc.getBoundingClientRect();
    pop = document.createElement("div");
    pop.setAttribute("role", "listbox");
    pop.className = "_floatingContainer_d7ago_103";
    pop.style.cssText = `left:${r.left + scrollX}px;top:${r.bottom + scrollY}px;width:${r.width}px`;
    pop.innerHTML = '<div class="ashby-application-form-input-autocomplete-popup">' +
      CITIES.filter(c => c.toLowerCase().includes(q)).map((c, i) => `<div role="option" id=":r${i}:" class="ashby-application-form-input-autocomplete-popup-result">${c}</div>`).join("") + "</div>";
    document.body.appendChild(pop);
    loc.setAttribute("aria-expanded", "true");
    pop.querySelectorAll("[role=option]").forEach(o => o.addEventListener("click", () => { loc.value = o.textContent; loc.dataset.picked = "1"; closePop(); }));
  }, 250);
});
loc.addEventListener("keydown", e => { if (e.key === "Escape") closePop(); });
// react-datepicker as on a live Ashby form: typed MM/DD/YYYY selects the date; on blur the text is redrawn from
// the selection, so text it cannot parse ("1-2 weeks") is cleared.
const dp = document.querySelector(".ashby-application-form-input-date");
const parseUS = s => {
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(s.trim());
  const d = m && new Date(+m[3], m[1] - 1, +m[2]);
  return d && d.getMonth() === m[1] - 1 && d.getDate() === +m[2] ? s.trim() : "";
};
dp.addEventListener("input", () => { dp.dataset.selected = parseUS(dp.value); });
dp.addEventListener("blur", () => { dp.value = dp.dataset.selected || ""; });
document.querySelectorAll("input[type=file]").forEach(f => f.addEventListener("change", () => {
  // An upload asks for a handle, goes to storage, then ApiSetFormValueToFile files it on the form.
  api("ApiCreateFileUploadHandle", {}).then(() => api("ApiSetFormValueToFile", { path: f.id, value: f.files[0]?.name ?? null }));
  const s = f.parentElement.querySelector(".file-name");
  if (s) s.textContent = f.files[0]?.name || "";
}));
document.querySelector(".ashby-application-form-submit-button").addEventListener("click", async () => {
  document.querySelectorAll(".err").forEach(x => x.remove());
  const bad = [];
  document.querySelectorAll(".ashby-application-form-container input[required][type=text], input[required][type=email], input[required][type=tel], textarea[required]").forEach(el => { if (!el.value.trim()) bad.push(el); });
  if (!document.getElementById("_systemfield_resume").files.length) bad.push(document.getElementById("_systemfield_resume"));
  if (!loc.dataset.picked) bad.push(loc);
  if (!dp.dataset.selected) bad.push(dp);
  if (bad.length) {
    bad.forEach(el => { const m = document.createElement("p"); m.className = "err"; m.setAttribute("role", "alert"); m.textContent = "Missing entry for required field"; el.closest(".ashby-application-form-field-entry").appendChild(m); });
    return;
  }
  const { missing } = await api("ApiSubmitSingleApplicationFormAction", {});
  if (missing.length) {
    const m = document.createElement("div"); m.className = "err"; m.setAttribute("role", "alert");
    m.textContent = "Your form needs corrections " + missing.map(t => "Missing entry for required field: " + t).join(" ");
    document.getElementById("form").prepend(m);
    return;
  }
  document.getElementById("form").innerHTML = '<div class="ashby-application-form-success-container"><h2>Success</h2><p>Thank you for applying. Your application has been received.</p></div>';
});
</script>
